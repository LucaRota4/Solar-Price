[theme]
base = "dark"
primaryColor = "#3987e5"
backgroundColor = "#0f1115"
secondaryBackgroundColor = "#181b21"
textColor = "#e8e9ec"
borderColor = "#2a2e36"
baseRadius = "0.375rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"

[client]
toolbarMode = "minimal"

[server]
headless = true

[browser]
gatherUsageStats = false
